# ===== Database (PostgreSQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careerhub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:careerhub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CareerHub@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== High-Performance HikariCP Connection Pool =====
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===== High-Concurrency Tomcat Thread Pool =====
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# ===== JWT =====
# IMPORTANT: change this to a long random string before production use.
app.jwt.secret=ChangeThisToALongRandomSecretKeyForJWTSigning_AtLeast32Chars
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ===== Resend Transactional Email API =====
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}


# ===== File Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== AWS S3 Configuration =====
aws.s3.bucket-name=graphix-techhire-2026
aws.s3.region=ap-south-1
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# ===== Twilio Configuration =====
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+18005550199}

# ===== Server =====
server.port=8081

# ===== AI & Gemini API Configuration =====
gemini.api.key=${GEMINI_API_KEY:}

# ===== Google OAuth 2.0 Credentials =====
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
