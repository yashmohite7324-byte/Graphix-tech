# ===== Database (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/careerhub_db
spring.datasource.username=careerhub_user
spring.datasource.password=CareerHub@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# update = safe for development, auto-creates/updates tables from entities.
# Switch to Flyway migrations (set this to "validate") before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
# IMPORTANT: change this to a long random string before production use.
app.jwt.secret=ChangeThisToALongRandomSecretKeyForJWTSigning_AtLeast32Chars
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ===== OTP / Mail =====
app.otp.expiration-minutes=10
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== File Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Server =====
server.port=8080

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
